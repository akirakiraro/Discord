name: QA desktop

on:
  push:
    branches:
      - qa

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: discord/package-lock.json

      - name: Instalar dependências
        working-directory: discord
        run: npm ci

      - name: Rodar os testes
        working-directory: discord
        run: npm test

      - name: Typecheck
        working-directory: discord
        run: npm run typecheck

  publish:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: discord/package-lock.json

      - name: Instalar dependências
        working-directory: discord
        run: npm ci

      - name: Versão da execução
        working-directory: discord
        run: node -e "const fs=require('fs'); const p='apps/desktop/package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version='0.1.${{ github.run_number }}'; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"

      - name: Compilar
        working-directory: discord
        run: npm run build -w @radcord/desktop

      - name: Área de testes fora do instalador
        working-directory: discord
        run: node scripts/check-no-dev-tools.mjs apps/desktop/out

      - name: Gerar instalador
        working-directory: discord/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --publish never

      - name: Publicar release
        working-directory: discord/apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # O nome do arquivo fica Radcord-Setup: o latest.yml e o app já instalado usam esse path.
          $setupName = "Radcord-Setup-$version.exe"
          $blockName = "$setupName.blockmap"
          $stage = Join-Path $env:RUNNER_TEMP "radcord-release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $setupPath = Join-Path "release" $setupName
          $blockPath = Join-Path "release" $blockName
          $latestPath = Join-Path "release" "latest.yml"
          if (-not (Test-Path -LiteralPath $setupPath) -or -not (Test-Path -LiteralPath $blockPath) -or -not (Test-Path -LiteralPath $latestPath)) {
            throw "Pacote $version incompleto em release/. Esperado $setupName, $blockName e latest.yml."
          }
          $yml = Get-Content -LiteralPath $latestPath -Raw
          if ($yml -notmatch [regex]::Escape($setupName)) {
            throw "latest.yml não cita $setupName. O electron-updater baixaria um arquivo que a release não publica."
          }
          Copy-Item -LiteralPath $setupPath -Destination (Join-Path $stage $setupName)
          Copy-Item -LiteralPath $blockPath -Destination (Join-Path $stage $blockName)
          Copy-Item -LiteralPath $latestPath -Destination (Join-Path $stage "latest.yml")
          gh release create "v$version" --repo akirakiraro/Discord --title "SoundRoom $version" --notes "Atualização $version" (Join-Path $stage "latest.yml") (Join-Path $stage $setupName) (Join-Path $stage $blockName)
