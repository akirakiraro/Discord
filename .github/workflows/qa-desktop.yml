name: QA desktop

on:
  push:
    branches:
      - qa

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: discord/package-lock.json

      - name: Instalar dependências
        working-directory: discord
        run: npm ci

      - name: Versão da execução
        working-directory: discord
        run: node -e "const fs=require('fs'); const p='apps/desktop/package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version='0.1.${{ github.run_number }}'; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"

      - name: Compilar
        working-directory: discord
        run: npm run build -w @radcord/desktop

      - name: Gerar instalador
        working-directory: discord/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --publish never

      - name: Publicar release
        working-directory: discord/apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stage = Join-Path $env:RUNNER_TEMP "radcord-release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $setup = Get-ChildItem release -Filter "*Setup*$version*.exe" | Where-Object { $_.Extension -eq ".exe" } | Select-Object -First 1
          $block = Get-ChildItem release -Filter "*$version*.blockmap" | Select-Object -First 1
          if (-not $setup -or -not $block -or -not (Test-Path "release\latest.yml")) { throw "Pacote $version incompleto em release/" }
          Copy-Item -LiteralPath $setup.FullName -Destination (Join-Path $stage "Radcord-Setup-$version.exe")
          Copy-Item -LiteralPath $block.FullName -Destination (Join-Path $stage "Radcord-Setup-$version.exe.blockmap")
          Copy-Item -LiteralPath "release\latest.yml" -Destination (Join-Path $stage "latest.yml")
          gh release create "v$version" --repo akirakiraro/Discord --title "Radcord $version" --notes "Atualização $version" (Join-Path $stage "latest.yml") (Join-Path $stage "Radcord-Setup-$version.exe") (Join-Path $stage "Radcord-Setup-$version.exe.blockmap")
